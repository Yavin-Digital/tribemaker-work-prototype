name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the site from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST "${auth[@]}" \
            "https://api.github.com/repos/${repo}/pages" \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "create ${code}"
          cat /tmp/pages.json
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT "${auth[@]}" \
              "https://api.github.com/repos/${repo}/pages" \
              -d '{"cname":"tribemakerwork.clientreview.co","source":{"branch":"main","path":"/"}}')
            echo "update ${code}"
            cat /tmp/pages.json
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              exit 1
            fi
          fi
          curl -sS -X POST "${auth[@]}" "https://api.github.com/repos/${repo}/pages/builds" -d '{}' || true
          echo
          curl -sS "${auth[@]}" "https://api.github.com/repos/${repo}/pages"
          echo
